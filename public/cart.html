<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart · SportHub</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <h1 class="app-title">SPORTHUB</h1>
    </div>
    <nav class="site-nav">
      <a href="/index.html" class="nav-link">Home</a>
      <a href="/products.html" class="nav-link">Products</a>
      <a href="/cart.html" class="nav-link active">Cart <span class="badge" id="cart-badge">0</span></a>
      <a href="/login.html" class="nav-link nav-cta">Login</a>
    </nav>
  </header>

  <section class="container">
    <div class="section-head">
      <h3 class="section-title">Your cart</h3>
    </div>
    <div id="cart-empty" class="empty-state" style="display:none;">
      <div class="empty-emoji">🛒</div>
      <p>Your cart is empty.</p>
      <a href="/products.html" class="btn btn-primary">Browse products</a>
    </div>
    <div id="cart-content">
      <table class="cart-table">
        <thead>
          <tr>
            <th>Item</th>
            <th>Price</th>
            <th>Qty</th>
            <th>Subtotal</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="cart-body"></tbody>
      </table>
      <div class="cart-summary">
        <div class="summary-row"><span>Subtotal</span><span id="sub">$0.00</span></div>
        <div class="summary-row"><span>Shipping</span><span id="ship">$9.99</span></div>
        <div class="summary-row total"><span>Total</span><span id="total">$0.00</span></div>
        <button id="checkout-btn" class="btn btn-primary btn-block">Checkout</button>
        <div id="status" class="status" role="status" aria-live="polite"></div>
      </div>
    </div>
  </section>

  <footer class="site-footer">
    <span>© 2026 SportHub</span>
  </footer>

  <script src="/data.js"></script>
  <script src="/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      SH.renderCart();
      document.getElementById("checkout-btn").addEventListener("click", () => {
        const status = document.getElementById("status");
        if (SH.cart().length === 0) {
          status.textContent = "Your cart is empty.";
          status.classList.add("error");
          return;
        }
        status.textContent = "Demo only — checkout not connected.";
        status.classList.add("error");
      });
    });
  </script>
</body>
</html>
